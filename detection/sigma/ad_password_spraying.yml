# =============================================================================
# Scénario 02 — Password Spraying Active Directory (MITRE ATT&CK T1110.003)
# Format : SigmaHQ. Le spraying = UN mot de passe testé sur BEAUCOUP de comptes.
# On compte donc le nombre de comptes DISTINCTS en échec depuis une même source.
# =============================================================================
title: Échec d'ouverture de session Windows (4625)
name: win_failed_logon_lab
id: 8fde7f87-8df5-4cef-87dc-a48e85be638c
status: experimental
description: Échec d'authentification Windows (EventID 4625) — brique du spraying.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: André Capito (@acapitow)
date: 2026-10-13
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    # 0xC000006A = mauvais mot de passe ; 0xC0000064 = utilisateur inexistant
    filter_optional_substatus:
        SubStatus:
            - '0xC000006A'
            - '0xC0000064'
    condition: selection
falsepositives:
    - Application mal configurée réessayant avec de mauvais identifiants
level: low
tags:
    - attack.credential-access
    - attack.t1110.003
---
# Corrélation : >= 5 comptes DISTINCTS visés depuis une même IP en 5 minutes.
title: Password Spraying Active Directory détecté
id: 2a6f0b17-9e44-4d2b-8c3a-6b1e7c9d4f02
status: experimental
description: >
    Une même adresse source provoque des échecs 4625 sur au moins 5 comptes
    différents en 5 minutes : comportement typique du password spraying (T1110.003),
    conçu pour rester sous le seuil de verrouillage par compte.
correlation:
    type: value_count
    rules:
        - win_failed_logon_lab
    group-by:
        - IpAddress
    timespan: 5m
    condition:
        gte: 5
        field: TargetUserName
level: high
tags:
    - attack.credential-access
    - attack.t1110.003
