# Configuration Ansible du SOC Home Lab
[defaults]
inventory          = inventory.ini
roles_path         = roles
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
# Ansible découvre l'interpréteur Python des cibles Linux automatiquement.
interpreter_python = auto_silent
# Collections requises : voir requirements.yml (ansible-galaxy collection install -r requirements.yml)
collections_path   = collections

[privilege_escalation]
become        = True
become_method = sudo

# Paramètres WinRM par défaut (surchargés par group_vars/windows.yml si besoin)
[winrm]
transport = ntlm
