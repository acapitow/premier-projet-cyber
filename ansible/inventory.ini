# Inventaire de RÉFÉRENCE (documentation).
#
# En pratique, Vagrant génère automatiquement l'inventaire utilisé pour le
# provisioning (canal de contrôle via l'interface NAT), avec les bons ports/clés.
# Ce fichier décrit la topologie « cible » et sert si vous pilotez Ansible à la
# main APRÈS `vagrant up` (depuis une VM du réseau interne, ex. SIEM01).

[siem]
siem01 ansible_host=10.20.0.40

[srv]
srv01 ansible_host=10.20.0.30

[dc]
dc01 ansible_host=10.20.0.10

[ws]
ws01 ansible_host=10.20.0.20

[attacker]
attack01 ansible_host=10.20.0.50

# Groupes transverses
[linux:children]
siem
srv
attacker

[windows:children]
dc
ws

[wazuh_agents:children]
srv
dc
ws
